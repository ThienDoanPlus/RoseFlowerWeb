<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác thực tài khoản liên kết - Rose Flowers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .oauth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .header {
      padding: 28px 24px 20px;
      text-align: center;
      border-bottom: 1px solid #f1f5f9;
    }
    .google-logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
    }
    .fb-logo {
      width: 44px;
      height: 44px;
      background: #1877F2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
    }
    .subtitle strong {
      color: #881337;
    }
    .content {
      padding: 24px;
    }
    .scope-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }
    .scope-box strong {
      color: #0f172a;
      display: block;
      margin-bottom: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s;
    }
    .input-field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-google {
      background: #1a73e8;
    }
    .btn-google:hover {
      background: #1557b0;
    }
    .btn-fb {
      background: #1877F2;
    }
    .btn-fb:hover {
      background: #166fe5;
    }
    .btn-cancel {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-cancel:hover {
      background: #f1f5f9;
      color: #334155;
    }
    .security-note {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .badge-google {
      background: #e8f0fe;
      color: #1967d2;
    }
    .badge-fb {
      background: #e7f3ff;
      color: #1877F2;
    }
  </style>
</head>
<body>

  <div class="oauth-card" id="oauthCard">
    <div class="header" id="headerArea">
      <!-- Dynamic header based on provider -->
    </div>

    <div class="content">
      <div class="scope-box" id="scopeBox">
        <!-- Scope disclaimer -->
      </div>

      <form id="oauthForm">
        <div class="form-group">
          <label id="emailLabel" for="userEmail">Tài khoản Email:</label>
          <input 
            type="email" 
            id="userEmail" 
            class="input-field" 
            required 
            placeholder="nhap-email-cua-ban@gmail.com" 
          />
        </div>

        <div class="form-group">
          <label id="nameLabel" for="userName">Họ và tên hiển thị:</label>
          <input 
            type="text" 
            id="userName" 
            class="input-field" 
            required 
            placeholder="Họ và tên của bạn" 
          />
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          Đồng ý & Liên kết tài khoản
        </button>

        <button type="button" class="btn-cancel" onclick="window.close()">
          Hủy bỏ
        </button>
      </form>

      <div class="security-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Kết nối bảo mật mã hóa SSL 256-bit qua OAuth 2.0
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const provider = params.get('provider') || 'google';

    const headerArea = document.getElementById('headerArea');
    const scopeBox = document.getElementById('scopeBox');
    const btnSubmit = document.getElementById('btnSubmit');
    const emailLabel = document.getElementById('emailLabel');
    const userEmailInput = document.getElementById('userEmail');
    const userNameInput = document.getElementById('userName');

    if (provider === 'facebook') {
      document.title = 'Đăng nhập bằng Facebook - Rose Flowers';
      headerArea.innerHTML = `
        <div class="badge badge-fb">Meta / Facebook Login</div>
        <div class="fb-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </div>
        <h1 class="title">Đăng nhập bằng Facebook</h1>
        <p class="subtitle">Liên kết hồ sơ mạng xã hội với <strong>Rose Flowers</strong></p>
      `;
      scopeBox.innerHTML = `
        <strong>Quyền truy cập thông tin công khai:</strong>
        Rose Flowers sẽ nhận được họ tên, địa chỉ email và ảnh đại diện Facebook của bạn để tạo hồ sơ thành viên và áp dụng mã ưu đãi Chào Bạn Mới (ROSE10).
      `;
      btnSubmit.className = 'btn-submit btn-fb';
      btnSubmit.innerText = 'Tiếp tục với Facebook';
      emailLabel.innerText = 'Email hoặc số điện thoại Facebook:';
      userEmailInput.placeholder = 'ban@facebook.com hoặc email cá nhân';
      userNameInput.placeholder = 'Tên Facebook của bạn';
    } else {
      document.title = 'Đăng nhập bằng Google - Rose Flowers';
      headerArea.innerHTML = `
        <div class="badge badge-google">Google Identity Services</div>
        <svg class="google-logo" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <h1 class="title">Đăng nhập bằng Google</h1>
        <p class="subtitle">Tiếp tục tới ứng dụng <strong>Rose Flowers</strong></p>
      `;
      scopeBox.innerHTML = `
        <strong>Xác thực tài khoản Google:</strong>
        Rose Flowers sẽ sử dụng tên, địa chỉ Gmail và ảnh hồ sơ công khai của bạn để đăng ký tài khoản khách hàng thân thiết.
      `;
      btnSubmit.className = 'btn-submit btn-google';
      btnSubmit.innerText = 'Tiếp tục với Google';
      emailLabel.innerText = 'Địa chỉ Gmail của bạn:';
      userEmailInput.placeholder = 'dia-chi-email@gmail.com';
      userNameInput.placeholder = 'Tên của bạn trên Google';
    }

    // Submit handler: send postMessage back to opener
    document.getElementById('oauthForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = userEmailInput.value.trim();
      const name = userNameInput.value.trim();

      if (!email) return;

      const avatarUrl = provider === 'facebook'
        ? 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'
        : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80';

      const payload = {
        type: 'ROSE_OAUTH_SUCCESS',
        provider: provider,
        email: email,
        name: name || email.split('@')[0],
        avatarUrl: avatarUrl
      };

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, '*');
        btnSubmit.innerText = 'Đang hoàn tất liên kết...';
        btnSubmit.disabled = true;
        setTimeout(() => {
          window.close();
        }, 500);
      } else {
        alert('Cửa sổ chính không còn mở. Vui lòng quay lại trang web.');
      }
    });
  </script>
</body>
</html>
