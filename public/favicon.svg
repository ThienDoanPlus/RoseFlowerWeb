<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Velvet Crimson Gradient -->
    <linearGradient id="roseMedallion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Rose Petal Shading Gradient -->
    <linearGradient id="petalShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
  </defs>

  <!-- Base Circle Medallion -->
  <circle cx="32" cy="32" r="30" fill="url(#roseMedallion)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2"/>

  <!-- Emerald Green Leaves -->
  <!-- Left Leaf -->
  <path d="M 23 45 C 13 46 11 36 21 34 C 23 38 25 42 23 45 Z" fill="url(#leafGradient)" opacity="0.95"/>
  <!-- Right Leaf -->
  <path d="M 41 45 C 51 46 53 36 43 34 C 41 38 39 42 41 45 Z" fill="url(#leafGradient)" opacity="0.95"/>

  <!-- Blooming Rose Petals -->
  <!-- Outer Petals Left & Right -->
  <path d="M 32 46 C 20 46 16 35 22 26 C 26 21 32 23 32 23 C 32 23 38 21 42 26 C 48 35 44 46 32 46 Z" fill="url(#petalShade)"/>
  
  <!-- Outer Lower Petal Lip -->
  <path d="M 24 38 C 28 44 36 44 40 38 C 36 41 28 41 24 38 Z" fill="#fda4af"/>

  <!-- Mid Petal Layer -->
  <path d="M 32 41 C 24 41 22 32 27 26 C 30 22 34 22 34 22 C 34 22 38 22 41 26 C 46 32 40 41 32 41 Z" fill="#ffffff"/>
  <path d="M 26 34 C 29 38 35 38 38 34 C 35 36 29 36 26 34 Z" fill="#fb7185"/>

  <!-- Rose Heart / Spiral Bud -->
  <path d="M 32 36 C 27 36 26 29 30 25 C 33 22 35 23 35 23 C 35 23 37 24 37 27 C 37 32 34 36 32 36 Z" fill="#ffe4e6"/>
  <path d="M 31 29 C 30 27 33 25 34 27 C 35 29 33 32 31 31 Z" fill="#e11d48"/>

  <!-- Luxury Gold Sparkle Star (Top Right) -->
  <path d="M 48 16 Q 48 20 52 20 Q 48 20 48 24 Q 48 20 44 20 Q 48 20 48 16 Z" fill="url(#goldGradient)"/>
  <!-- Mini Sparkle Dot (Top Left) -->
  <circle cx="16" cy="20" r="1.5" fill="#fef08a" opacity="0.85"/>
</svg>

